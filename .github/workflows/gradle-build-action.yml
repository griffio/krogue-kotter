name: Run Gradle on PRs
on: [workflow_dispatch, pull_request]
jobs:
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    
    - name: Execute Gradle build
      run: ./gradlew build
